# A deliberately broken, four-task variant of the motor controller.
#
# Compared with motor-control.yaml it omits telemetry and the sensor service
# channel, runs the logger periodically, and gives the logger a 900us stateLock
# critical section with PTHREAD_PRIO_NONE. Run `scheduloscope analyze` on it
# and compare: the analysis refuses a finite bound, and the simulator shows the
# logger holding the lock while a middle-priority task preempts it, so control
# misses its deadline. This is the classic Mars Pathfinder bug in QNX terms,
# and it is the failure mode PTHREAD_PRIO_INHERIT prevents.

schema: scheduloscope/v1

name: motor-control-no-inheritance
description: >
  A deliberately broken four-task variant. Telemetry and the sensor channel are
  omitted, the logger runs periodically, and its 900us stateLock critical section
  disables priority inheritance. Control can be delayed by the logger while a
  middle-priority thread runs, which is unbounded priority inversion.

cpu:
  cores: 1
  contextSwitchUs: 2
  privilegedPriorityCeiling: 63

clock:
  periodUs: 1000
  roundRobinTimesliceTicks: 4

interrupts:
  entryOverheadUs: 2
  sources:
    - name: adc
      period: 500us
      service: 24us

resources:
  - name: stateLock
    protocol: none

channels:
  - name: sensorHub
    serverThreads: 1
    basePriority: 45
    handler:
      - cpu: 40us

tasks:
  - name: safety
    priority: 70
    period: 2ms
    deadline: 2ms
    segments:
      - cpu: 80us
      - cs:
          resource: stateLock
          work: 40us
      - cpu: 40us

  - name: control
    priority: 60
    period: 1ms
    deadline: 1ms
    segments:
      - cpu: 150us
      - rpc:
          channel: sensorHub
          timeout: 2ms
      - cpu: 120us
      - cs:
          resource: stateLock
          work: 60us

  - name: logger
    priority: 15
    period: 15ms
    deadline: 50ms
    segments:
      - cs:
          resource: stateLock
          work: 900us
      - cpu: 300us

  - name: planner
    priority: 40
    period: 5ms
    deadline: 5ms
    segments:
      - cpu: 700us

simulation:
  seed: 424242
  durationUs: 60000

